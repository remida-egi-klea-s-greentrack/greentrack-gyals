name: Deploy Frontend

# Build i React me URL-në e API-së nga Terraform, upload në S3 dhe invalidim i CloudFront.

on:
  push:
    branches: [main]
    paths:
      - "app/frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: frontend-production
  cancel-in-progress: false

env:
  AWS_REGION: eu-central-1
  DEPLOY_ROLE_ARN: arn:aws:iam::886565871385:role/g2-greentrack-github-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Read Terraform outputs
        id: tf
        working-directory: infra
        run: |
          terraform init -input=false \
            -backend-config="bucket=g2-greentrack-tfstate-886565871385" \
            -backend-config="key=greentrack/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true" >/dev/null
          echo "api_url=$(terraform output -raw api_gateway_url)" >> "$GITHUB_OUTPUT"
          echo "bucket=$(terraform output -raw frontend_bucket_name)" >> "$GITHUB_OUTPUT"
          echo "distribution=$(terraform output -raw cloudfront_distribution_id)" >> "$GITHUB_OUTPUT"
          echo "url=$(terraform output -raw cloudfront_url)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - name: Build
        working-directory: app/frontend
        env:
          VITE_API_URL: ${{ steps.tf.outputs.api_url }}
        run: |
          npm ci
          npm run build

      - name: Upload to S3
        run: |
          # assets/ kanë hash në emër -> cache i gjatë; index.html pa cache
          aws s3 sync app/frontend/dist/ "s3://${{ steps.tf.outputs.bucket }}/" --delete \
            --exclude index.html --cache-control "public,max-age=31536000,immutable"
          aws s3 cp app/frontend/dist/index.html "s3://${{ steps.tf.outputs.bucket }}/index.html" \
            --cache-control "no-cache"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.tf.outputs.distribution }}" --paths "/*" \
            --query "Invalidation.Id" --output text

      - name: Check site responds
        run: |
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "${{ steps.tf.outputs.url }}")
            [ "$code" = "200" ] && echo "Site OK: ${{ steps.tf.outputs.url }}" && exit 0
            sleep 10
          done
          echo "::error::Site did not return 200"; exit 1
