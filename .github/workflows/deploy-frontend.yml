name: Deploy Frontend

# DISABLED: This workflow is in draft mode and requires AWS access
# To enable: Remove the 'if: false' condition and configure AWS credentials

on:
  push:
    branches:
      - main
    paths:
      - 'app/frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:  # Manual trigger

# TODO: Add OIDC permissions when AWS access is configured
# permissions:
#   id-token: write
#   contents: read

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    if: false  # DISABLED - Remove this line when AWS is configured
    environment: production  # Requires approval
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: app/frontend/package-lock.json

      - name: Install dependencies
        working-directory: app/frontend
        run: npm ci

      - name: Build frontend
        working-directory: app/frontend
        run: npm run build
        env:
          # TODO: Set API URL from Terraform output
          # VITE_API_URL: ${{ secrets.API_GATEWAY_URL }}
          VITE_API_URL: 'http://localhost:8080'

      - name: Run frontend tests
        working-directory: app/frontend
        run: npm test --if-present
        continue-on-error: true

