name: Terraform Apply

# Apply i app stack në production pas merge në main, pastaj smoke test end-to-end.
# Job-i përdor environment "production" (mund të kërkojë aprovim në GitHub Settings > Environments).

on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - "!infra/github-oidc/**"
      - "app/**"
      - "!app/frontend/**"
      - "fixtures/**"
      - ".github/workflows/terraform-apply.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-production
  cancel-in-progress: false

env:
  AWS_REGION: eu-central-1
  DEPLOY_ROLE_ARN: arn:aws:iam::886565871385:role/g2-greentrack-github-deploy
  TF_VAR_environment: production
  TF_VAR_default_tags: '{"Project":"GreenTrack","ManagedBy":"Terraform","Environment":"production","Team":"Group2"}'

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: production
    outputs:
      api_url: ${{ steps.out.outputs.api_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build Lambda package
        run: python infra/build/create_lambda_zip.py

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init
        working-directory: infra
        run: |
          terraform init -input=false \
            -backend-config="bucket=g2-greentrack-tfstate-886565871385" \
            -backend-config="key=greentrack/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Terraform plan
        working-directory: infra
        run: |
          set -o pipefail
          terraform plan -input=false -no-color -out=tfplan | tee plan.txt
          {
            echo "## Terraform plan (production)"
            echo '```'
            grep -E '^\s*# |^Plan:|^No changes' plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Guard - refuse destroys in production
        working-directory: infra
        run: |
          # Mbrojtje: apply automatik nuk fshin burime. Për fshirje, bëje me dorë dhe me qëllim.
          if grep -qE 'will be destroyed|must be replaced' plan.txt; then
            echo "::error::Plan contains destroy/replace - aborting automatic apply."
            grep -E 'will be destroyed|must be replaced' plan.txt
            exit 1
          fi

      - name: Terraform apply
        working-directory: infra
        run: terraform apply -input=false -no-color tfplan

      - name: Outputs
        id: out
        working-directory: infra
        run: |
          echo "api_url=$(terraform output -raw api_gateway_url)" >> "$GITHUB_OUTPUT"
          echo "API: $(terraform output -raw api_gateway_url)" >> "$GITHUB_STEP_SUMMARY"
          echo "Frontend: $(terraform output -raw cloudfront_url)" >> "$GITHUB_STEP_SUMMARY"

  smoke-test:
    needs: apply
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: End-to-end smoke test against production API
        run: python scripts/smoke_test.py --api-url "${{ needs.apply.outputs.api_url }}" --chat
