name: Terraform Plan

# Plan i app stack (production) për çdo PR që prek infra ose kodin e Lambda-ve.
# Përdor rolin read-only g2-greentrack-github-plan (OIDC) dhe -lock=false, pra nuk ndryshon asgjë.

on:
  pull_request:
    paths:
      - "infra/**"
      - "app/**"
      - "fixtures/**"
      - ".github/workflows/terraform-plan.yml"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-central-1
  PLAN_ROLE_ARN: arn:aws:iam::886565871385:role/g2-greentrack-github-plan
  TF_VAR_environment: production
  TF_VAR_default_tags: '{"Project":"GreenTrack","ManagedBy":"Terraform","Environment":"production","Team":"Group2"}'

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build Lambda package
        run: python infra/build/create_lambda_zip.py

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.6

      - name: Configure AWS credentials (OIDC, read-only)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init
        working-directory: infra
        run: |
          terraform init -input=false \
            -backend-config="bucket=g2-greentrack-tfstate-886565871385" \
            -backend-config="key=greentrack/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Terraform validate
        working-directory: infra
        run: terraform validate -no-color

      - name: Terraform plan
        id: plan
        working-directory: infra
        run: |
          set -o pipefail
          terraform plan -input=false -no-color -lock=false | tee plan.txt

      - name: Plan summary
        if: always()
        working-directory: infra
        run: |
          {
            echo "## Terraform plan (production)"
            echo '```'
            grep -E '^\s*# |^Plan:|^No changes' plan.txt || echo "plan.txt missing"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
